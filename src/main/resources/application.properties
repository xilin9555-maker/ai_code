spring.application.name=ai-code
spring.profiles.active=local
server.port=8101
server.servlet.context-path=/api
# 生成完整网站可能需要几分钟，SSE 异步请求应覆盖整个生成过程。
spring.mvc.async.request-timeout=600000

# 使用 Redis 统一保存用户登录 Session。30 天内持续使用同一 Cookie 时，服务重启或切换实例后仍可恢复登录态。
spring.session.timeout=30d
# 为本项目使用独立前缀，便于在 Redis 中识别 Session，并避免和 AI 对话记忆 Key 混在一起。
spring.session.redis.namespace=ai-code:session
# 浏览器 Cookie 与服务端 Session 使用相同有效期；HttpOnly 可以阻止页面脚本直接读取会话标识。
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_code}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# OpenAPI controller scanning
springdoc.group-configs[0].group=default
springdoc.group-configs[0].packages-to-scan=com.tmz.aicode.controller

# Knife4j API documentation
knife4j.enable=true
knife4j.setting.language=zh_cn

# DashScope 文生图配置。密钥通过环境变量注入，模型可以按部署环境覆盖。
dashscope.api-key=${DASHSCOPE_API_KEY: sk-ws-H.PHRDMMH.zewb.MEUCIEfpkZHB--xCl8ayYoVa5RAMohj-eOgijPqxJuJlDvXVAiEAmYeMCqNrOKViRn4Pj1sfZS0wv38p0IdZvkpCtHbC7TU}
dashscope.image-model=${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}

# Pexels 内容图片搜索配置。访问密钥通过环境变量注入，避免将敏感信息提交到仓库。
pexels.api-key=${PEXELS_API_KEY: CFBDczU78QNwuPeQWGp1Tsedh6Nlsm1r1XrtCAgPxIDvwWkhqiTKTlw9}
