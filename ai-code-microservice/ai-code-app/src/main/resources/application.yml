spring:
  application:
    name: ai-code-app
  config:
    # 本地运行时复用项目根目录的私密配置；部署时仍由环境变量提供同名参数。
    import:
      - optional:file:./application_local.yml
      - optional:file:../application_local.yml
      - optional:file:../../application_local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_code}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ttl: ${REDIS_TTL:3600}
  session:
    store-type: redis
    timeout: 30d
    redis:
      # 与用户服务共享登录会话，模式切换和业务请求无需重复登录。
      namespace: ai-code:session
  mvc:
    async:
      request-timeout: 600000

server:
  port: 8125
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 30d
        http-only: true
        same-site: lax

langchain4j:
  open-ai:
    chat-model:
      # 部署环境优先读取环境变量；本地运行时兼容根目录已有的个人模型配置。
      base-url: ${AI_BASE_URL:${langchain4j.openai.chat-model.base-url}}
      api-key: ${AI_API_KEY:${langchain4j.openai.chat-model.api-key}}
      model-name: ${AI_MODEL_NAME:${langchain4j.openai.chat-model.model-name:deepseek-chat}}
      max-tokens: ${AI_MAX_TOKENS:${langchain4j.openai.chat-model.max-tokens:8192}}
      timeout: ${AI_TIMEOUT:${langchain4j.openai.chat-model.timeout:120s}}
      max-retries: ${AI_MAX_RETRIES:3}
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_BASE_URL:${langchain4j.openai.streaming-chat-model.base-url:${langchain4j.openai.chat-model.base-url}}}
      api-key: ${AI_API_KEY:${langchain4j.openai.streaming-chat-model.api-key:${langchain4j.openai.chat-model.api-key}}}
      model-name: ${AI_STREAMING_MODEL_NAME:${AI_MODEL_NAME:${langchain4j.openai.streaming-chat-model.model-name:${langchain4j.openai.chat-model.model-name:deepseek-chat}}}}
      max-tokens: ${AI_STREAMING_MAX_TOKENS:${AI_MAX_TOKENS:${langchain4j.openai.streaming-chat-model.max-tokens:${langchain4j.openai.chat-model.max-tokens:8192}}}}
      timeout: ${AI_STREAMING_TIMEOUT:${AI_TIMEOUT:${langchain4j.openai.streaming-chat-model.timeout:${langchain4j.openai.chat-model.timeout:120s}}}}
      log-requests: false
      log-responses: false
    reasoning-streaming-chat-model:
      # 未单独配置推理模型时，沿用默认流式模型，避免重复维护连接信息。
      base-url: ${REASONING_AI_BASE_URL:${AI_BASE_URL:${langchain4j.openai.streaming-chat-model.base-url:${langchain4j.openai.chat-model.base-url}}}}
      api-key: ${REASONING_AI_API_KEY:${AI_API_KEY:${langchain4j.openai.streaming-chat-model.api-key:${langchain4j.openai.chat-model.api-key}}}}
      model-name: ${REASONING_AI_MODEL_NAME:${AI_MODEL_NAME:${langchain4j.openai.streaming-chat-model.model-name:${langchain4j.openai.chat-model.model-name:deepseek-chat}}}}
      max-tokens: ${REASONING_AI_MAX_TOKENS:8192}
      temperature: 0.1
      timeout: ${REASONING_AI_TIMEOUT:120s}
      log-requests: false
      log-responses: false
    routing-chat-model:
      # 路由模型优先读取自己的配置，没有环境变量时复用个人配置中的轻量模型。
      base-url: ${ROUTING_AI_BASE_URL:${langchain4j.openai.routing-chat-model.base-url:${AI_BASE_URL:${langchain4j.openai.chat-model.base-url}}}}
      api-key: ${ROUTING_AI_API_KEY:${langchain4j.openai.routing-chat-model.api-key:${AI_API_KEY:${langchain4j.openai.chat-model.api-key}}}}
      model-name: ${ROUTING_AI_MODEL_NAME:${langchain4j.openai.routing-chat-model.model-name:qwen-turbo}}
      max-tokens: ${ROUTING_AI_MAX_TOKENS:${langchain4j.openai.routing-chat-model.max-tokens:1024}}
      temperature: 0.0
      timeout: ${ROUTING_AI_TIMEOUT:120s}
      log-requests: false
      log-responses: false

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}
pexels:
  api-key: ${PEXELS_API_KEY:}
code:
  deploy-host: ${CODE_DEPLOY_HOST:http://localhost}

springdoc:
  group-configs:
    - group: default
      packages-to-scan: com.tmz.aicode.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# 应用服务通过注册中心发现用户和截图服务；截图调用允许最长等待两分钟。
dubbo:
  registry:
    address: "nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}"
    register-mode: instance
  protocol:
    name: tri
    port: 50053
  consumer:
    timeout: 120000
  provider:
    timeout: 120000
