spring:
  application:
    name: ai-code-screenshot
  config:
    # 兼容从单体根目录、微服务聚合目录或当前模块目录启动。
    # 文件不存在时继续使用环境变量，私密配置不会被打包进产物。
    import:
      - optional:file:./application_local.yml
      - optional:file:../application_local.yml
      - optional:file:../../application_local.yml

server:
  port: 8127
  servlet:
    context-path: /api

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}

# 截图包含页面渲染和文件上传，因此提供方与消费方超时均设置为两分钟。
dubbo:
  registry:
    address: "nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}"
    register-mode: instance
  protocol:
    name: tri
    port: 50052
  consumer:
    timeout: 120000
  provider:
    timeout: 120000
