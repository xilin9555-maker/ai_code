spring:
  application:
    name: ai-code-user
  config:
    # 本地运行时读取项目根目录的私密配置；部署环境仍可使用环境变量覆盖。
    import:
      - optional:file:./application_local.yml
      - optional:file:../application_local.yml
      - optional:file:../../application_local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_code}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  session:
    store-type: redis
    timeout: 30d
    redis:
      # 用户服务和应用服务必须使用同一命名空间，登录态才能跨服务读取。
      namespace: ai-code:session

server:
  port: 8124
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 30d
        http-only: true
        same-site: lax

springdoc:
  group-configs:
    - group: default
      packages-to-scan: com.tmz.aicode.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# 用户服务以 Triple 协议暴露内部接口，并使用 Nacos 完成注册与发现。
dubbo:
  registry:
    address: "nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}"
    register-mode: instance
  protocol:
    name: tri
    port: 50051
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
