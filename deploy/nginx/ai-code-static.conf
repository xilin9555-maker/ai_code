# AI 生成网站的静态资源服务。
# 将本文件中的 server 块放入 nginx.conf 的 http 块，或在 http 块中 include 本文件。
server {
    listen 80;
    server_name localhost;

    charset utf-8;
    charset_types text/css application/javascript text/plain application/json;

    # deployKey 对应这里的一级子目录，例如 code_deploy/aB3xY9/index.html。
    root "F:/project/AI零代码应用生成平台/项目/ai-code/tmp/code_deploy";

    # 优先返回请求的真实文件；找不到时回退到应用首页，兼容前端路由地址。
    location ~ ^/([^/]+)/(.*)$ {
        try_files /$1/$2 /$1/index.html =404;
    }
}
